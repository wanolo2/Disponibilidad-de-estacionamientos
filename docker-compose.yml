
services:
  
  db-primary:
    image: postgres:16
    container_name: parkflow-db-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parkflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parkflow"]
      interval: 5s
      timeout: 3s
      retries: 10
   
  balanceador:
    image: nginx:alpine
    container_name: parkflow-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./balanceador/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-1
      - app-2

 

  db-replica:
    image: postgres:16
    container_name: parkflow-db-replica
    restart: unless-stopped
    environment:
      PGPASSWORD: ${REPLICATION_PASSWORD}
    depends_on:
      db-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    entrypoint:
      - bash
      - -ec
      - |
        mkdir -p "$$PGDATA"
        chown postgres:postgres "$$PGDATA"
        chmod 700 "$$PGDATA"

        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          echo "Inicializando replica..."
          gosu postgres pg_basebackup \
            -h db-primary \
            -U replicator \
            -D "$$PGDATA" \
            -Fp -Xs -P -R
        fi

        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parkflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  app-1:
    build: ./app
    container_name: parkflow-app-1
    restart: unless-stopped
    environment:
      INSTANCE_ID: app-1
    expose:
      - "8000"

  app-2:
    build: ./app
    container_name: parkflow-app-2
    restart: unless-stopped
    environment:
      INSTANCE_ID: app-2
    expose:
      - "8000"


volumes:
  postgres_primary_data:
  postgres_replica_data:
