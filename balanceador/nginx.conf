
upstream parkflow_backend {
    zone parkflow_backend 64k;
    server app-1:8000 max_fails=1 fail_timeout=5s;
    server app-2:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://parkflow_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
